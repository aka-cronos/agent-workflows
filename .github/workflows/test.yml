name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      - name: Lint examples
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color examples/agent-zones.yml examples/agent-carry.yml examples/agent-low-risk-merge.yml examples/agent-block.yml
